<html>
  <head>
    <meta charset="utf-8" />
    <title>MOKEPON</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <section id="select-pet">
      <h1 class="our_title">MOKEPON 💧🔥🌱</h1>

      <h2 class="sub_title">Elige a tu mascota</h2>

      <div id="card-container" class="mokepon_cards"></div>

      <button id="btn-pet" class="btn_pet">Seleccionar</button>
    </section>

    <section id="view-map">
      <h2 class="sub_title">Recorre el mapa con tú mokepon 💧🔥🌱</h2>
      <canvas id="map"></canvas>
      <button onmouseup="stopMove()" onmousedown="moveUp()">Arriba</button>
      <div>
        <button onmouseup="stopMove()" onmousedown="moveLeft()">
          Izquierda
        </button>
        <button onmouseup="stopMove()" onmousedown="moveDown()">Abajo</button>
        <button onmouseup="stopMove()" onmousedown="moveRight()">
          Derecha
        </button>
      </div>
    </section>

    <section id="select-attack">
      <h1 class="our_title">MOKEPON 💧🔥🌱</h1>

      <h2 class="sub_title">Elige a tu ataque</h2>

      <div id="types-attacks" class="types_attacks"></div>

      <div id="messages">
        <p id="result">Mucha suerte</p>

        <section id="section-reboot">
          <button id="btn-reboot">Reiniciar</button>
        </section>
      </div>

      <div id="battles">
        <div>
          <p id="player-pet"></p>
          <p id="pet-lifes" class="pet_lifes">0</p>
          <div id="player-attack"></div>
        </div>
        <div>
          <p id="enemy-pet"></p>
          <p id="enemy-pet-lifes" class="enemy_pet_lifes">0</p>
          <div id="enemy-attack"></div>
        </div>
      </div>
    </section>
    <script src="./js/mokepon.js"></script>
  </body>
</html>
